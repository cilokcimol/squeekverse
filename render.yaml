services:
  - type: web
    name: squeekverse
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_PATH
        value: /tmp/squeekverse.sqlite
      - key: CORS_ORIGIN
        value: "*"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
